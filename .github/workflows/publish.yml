name: Publish to GitHub Packages

# Manual only, matching the platform-wide decision that no pipeline runs on its own.
on:
  workflow_dispatch:

jobs:

  # Deletes the previous 1.0-SNAPSHOT version BEFORE publishing, not after.
  #
  # GitHub models a Maven SNAPSHOT as a single version: every `mvn deploy` adds another set of
  # timestamped files inside `1.0-SNAPSHOT` rather than creating a new version. So a
  # keep-the-latest-N prune deletes nothing, ever, while the files inside that one version keep
  # accumulating -- actions/delete-package-versions#71. Wiping the version first and republishing
  # keeps storage flat at roughly one publish's worth.
  #
  # continue-on-error because the first ever publish has no package to delete, and a fresh repo must
  # not be blocked by that.
  prune:
    name: Wipe the previous snapshot
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Wipe the previous snapshot (identity-signing)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: com.fooddelivery.identity-signing
          package-type: maven
          min-versions-to-keep: 0
          num-old-versions-to-delete: 100

  publish:
    name: Deploy identity-signing
    needs: prune
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # identity-signing's parent is food-delivery-parent, which is not published yet on a first run.
      - name: Checkout Parent POM
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/FoodDeliveryParentPOM
          path: deps/FoodDeliveryParentPOM
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Install Parent POM
        run: mvn -q -B -N install -f deps/FoodDeliveryParentPOM/pom.xml

      # The <id> must be `github`, matching <distributionManagement><repository><id> in the pom.
      # A mismatch fails with a 401 that reads like a permissions problem.
      - name: Write Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <!-- GITHUB_TOKEN, not a PAT. A workflow can publish to its OWN repository's
                     package registry with `permissions: packages: write` above, so this needs no
                     stored secret, is scoped to this repository alone, and expires with the run.
                     CHECKOUT_TOKEN is still used above, but only to check out sibling repos. -->
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Tests are not re-run on deploy: they run in this repo's own build, and repeating them makes
      # publishing slower without adding a check that has not already happened.
      - name: Deploy
        run: mvn -B deploy -DskipTests

